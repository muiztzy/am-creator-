<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087cf0">
<title>AM CREATOR</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050914;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    padding:18px;
    background:#08111f;
    border-bottom:1px solid #12345c;
    text-align:center;
}

.logo{
    color:#35a7ff;
    font-size:23px;
    font-weight:bold;
}

.container{
    max-width:650px;
    margin:auto;
    padding:18px;
}

.card{
    margin-top:18px;
    padding:22px;
    background:#09111e;
    border:1px solid #087cf0;
    border-radius:18px;
}

h1{
    color:#35a7ff;
    text-align:center;
}

h2{
    color:#8dcfff;
}

p{
    color:#b9dfff;
    line-height:1.5;
}

input,select{
    width:100%;
    padding:14px;
    margin:8px 0 15px;
    border-radius:10px;
    border:1px solid #23669d;
    background:#050914;
    color:white;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#087cf0;
    color:white;
    font-weight:bold;
    font-size:15px;
}

.notice{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#092440;
    color:#bfe3ff;
    font-size:13px;
}

footer{
    text-align:center;
    padding:25px;
    color:#66809b;
    font-size:12px;
}
</style>
</head>

<body>

<header>
    <div class="logo">⚡ AM CREATOR</div>
</header>

<div class="container">

    <div class="card">
        <h1>⚡ AM CREATOR</h1>

        <p style="text-align:center;">
            Selamat datang di AM CREATOR
        </p>
    </div>

    <div class="card">

        <h2>ALIGHT MOTION PREMIUM</h2>

        <label>Email</label>

        <input
            id="email"
            type="email"
            placeholder="Masukkan email kamu"
        >

        <label>Pilih Paket</label>

        <select id="paket">
            <option>Premium — 1 Bulan</option>
            <option>Premium — 1 Tahun</option>
        </select>

        <button onclick="kirim()">
            LANJUTKAN
        </button>

        <div class="notice">
            <b>Informasi:</b><br>
            Form ini hanya mencatat permintaan layanan.
            Premium Alight Motion harus diperoleh melalui cara resmi.
        </div>

    </div>

</div>

<footer>
    AM CREATOR © 2026
</footer>

<script>
function kirim(){

    const email =
        document.getElementById("email").value.trim();

    const paket =
        document.getElementById("paket").value;

    if(email === ""){
        alert("Masukkan email terlebih dahulu!");
        return;
    }

    if(!email.includes("@")){
        alert("Email tidak valid!");
        return;
    }

    alert(
        "Permintaan berhasil dibuat!\n\n" +
        "Paket: " + paket + "\n" +
        "Email: " + email
    );
}
</script>

</body>
</html>
