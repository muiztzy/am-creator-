<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Downloader</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  min-height:100vh;
  padding:25px 18px 45px;
  color:white;
  background:
    radial-gradient(circle at 10% 10%,#145b91 0%,transparent 32%),
    radial-gradient(circle at 90% 35%,#30206d 0%,transparent 35%),
    linear-gradient(135deg,#06111d,#15182b,#070c19);
}

.container{
  width:100%;
  max-width:650px;
  margin:auto;
}

.header{
  display:flex;
  align-items:center;
  gap:18px;
  margin:25px 8px 32px;
}

.logo{
  width:84px;
  height:84px;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:43px;
  background:linear-gradient(145deg,#20242c,#080b10);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 15px 35px rgba(0,0,0,.3);
}

.small{
  color:#aeb8c8;
  letter-spacing:4px;
  font-size:13px;
  margin-bottom:5px;
}

h1{
  font-size:39px;
  line-height:1.05;
}

.card,
.result,
.feature{
  border:1px solid rgba(255,255,255,.18);
  background:rgba(18,23,35,.58);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  box-shadow:
    inset 0 1px rgba(255,255,255,.1),
    0 20px 50px rgba(0,0,0,.2);
}

.card{
  border-radius:38px;
  padding:30px;
}

.title{
  display:flex;
  align-items:center;
  gap:20px;
  margin-bottom:28px;
}

.arrow{
  width:76px;
  height:76px;
  flex-shrink:0;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  color:#168cff;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(5,15,25,.5);
}

.title h2{
  font-size:31px;
}

.title p{
  color:#aeb2bd;
  font-size:18px;
  margin-top:4px;
}

.input{
  display:flex;
  align-items:center;
  gap:12px;
  padding:18px 20px;
  border-radius:29px;
  background:rgba(3,8,15,.65);
  border:1px solid rgba(255,255,255,.2);
}

.input span{
  font-size:25px;
}

input{
  width:100%;
  color:white;
  background:transparent;
  border:0;
  outline:0;
  font-size:17px;
}

input::placeholder{
  color:#747b87;
}

.clear{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  color:#ddd;
  background:rgba(255,255,255,.1);
  cursor:pointer;
}

.main-button{
  width:100%;
  margin-top:22px;
  padding:19px;
  border:0;
  border-radius:27px;
  color:white;
  font-size:23px;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(135deg,#19bfff,#087cf0);
  box-shadow:0 10px 35px rgba(0,130,255,.3);
}

.main-button:disabled{
  opacity:.6;
}

.status{
  display:none;
  text-align:center;
  margin-top:18px;
  color:#bfc7d5;
}

.result{
  display:none;
  margin-top:20px;
  border-radius:30px;
  padding:22px;
}

.result h3{
  font-size:24px;
  margin-bottom:16px;
}

.video{
  width:100%;
  max-height:500px;
  border-radius:20px;
  background:#000;
  display:block;
}

.save{
  display:block;
  margin-top:15px;
  padding:16px;
  border-radius:22px;
  text-align:center;
  text-decoration:none;
  color:white;
  font-weight:700;
  background:#087cf0;
}

.features{
  display:grid;
  gap:16px;
  margin-top:25px;
}

.feature{
  border-radius:25px;
  padding:25px;
  text-align:center;
}

.check{
  color:#00c934;
  font-size:27px;
  margin-bottom:7px;
}

.feature p{
  color:#c0c4cc;
  font-weight:600;
}

footer{
  text-align:center;
  color:#858c98;
  margin-top:38px;
  font-size:14px;
}

@media(max-width:500px){
  h1{font-size:34px}
  .card{padding:22px;border-radius:32px}
  .title h2{font-size:27px}
  .title p{font-size:16px}
  .arrow{width:65px;height:65px}
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">♪</div>

    <div>
      <div class="small">LIQUID GLASS</div>
      <h1>TikTok Downloader</h1>
    </div>
  </div>


  <div class="card">

    <div class="title">
      <div class="arrow">↓</div>

      <div>
        <h2>Download Video</h2>
        <p>Tempel link TikTok kamu di bawah.</p>
      </div>
    </div>


    <div class="input">
      <span>🔗</span>

      <input
        id="url"
        type="text"
        placeholder="Tempel link TikTok..."
      >

      <button class="clear" onclick="clearUrl()">×</button>
    </div>


    <button
      id="button"
      class="main-button"
      onclick="downloadTikTok()">
      ↓ Download
    </button>

    <div id="status" class="status"></div>

  </div>


  <div id="result" class="result">

    <h3>Hasil Download</h3>

    <video
      id="video"
      class="video"
      controls
      playsinline>
    </video>

    <a
      id="save"
      class="save"
      target="_blank"
      rel="noopener">
      ↓ Download Video
    </a>

  </div>


  <div class="features">

    <div class="feature">
      <div class="check">✓</div>
      <p>Liquid Glass UI</p>
    </div>

    <div class="feature">
      <div class="check">✓</div>
      <p>Mobile Friendly</p>
    </div>

    <div class="feature">
      <div class="check">✓</div>
      <p>Simple & Clean</p>
    </div>

  </div>


  <footer>
    TikTok Downloader · Gunakan secara bertanggung jawab
  </footer>

</div>


<script>

function clearUrl(){
  document.getElementById("url").value="";
  document.getElementById("status").style.display="none";
  document.getElementById("result").style.display="none";
}

async function downloadTikTok(){

  const url=document.getElementById("url").value.trim();
  const button=document.getElementById("button");
  const status=document.getElementById("status");
  const result=document.getElementById("result");
  const video=document.getElementById("video");
  const save=document.getElementById("save");

  if(!url){
    status.style.display="block";
    status.textContent="Tempel link TikTok terlebih dahulu.";
    return;
  }

  if(!url.includes("tiktok.com")){
    status.style.display="block";
    status.textContent="Masukkan link TikTok yang valid.";
    return;
  }

  button.disabled=true;
  button.textContent="⏳ Memproses...";
  status.style.display="block";
  status.textContent="Sedang mengambil video...";
  result.style.display="none";

  try{

    const response=await fetch(
      "https://www.tikwm.com/api/",
      {
        method:"POST",
        headers:{
          "Content-Type":
          "application/x-www-form-urlencoded"
        },
        body:
          "url="+encodeURIComponent(url)+
          "&hd=1"
      }
    );

    const data=await response.json();

    if(
      data &&
      data.data &&
      (data.data.play || data.data.hdplay)
    ){

      const videoUrl=
        data.data.hdplay ||
        data.data.play;

      video.src=videoUrl;

      save.href=videoUrl;
      save.download="tiktok-video.mp4";

      result.style.display="block";

      status.textContent="Video berhasil ditemukan ✓";

    }else{

      status.textContent=
        "Video tidak dapat diproses. Coba link lain.";

    }

  }catch(error){

    console.error(error);

    status.textContent=
      "Gagal menghubungkan ke server.";

  }

  button.disabled=false;
  button.textContent="↓ Download";
}

</script>

</body>
</html>
