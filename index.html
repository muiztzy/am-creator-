<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TikTok Downloader</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Segoe UI",Arial,sans-serif;
}

body{
  min-height:100vh;
  color:white;
  background:
    radial-gradient(circle at 10% 10%,rgba(45,140,255,.28),transparent 35%),
    radial-gradient(circle at 90% 40%,rgba(130,70,180,.25),transparent 40%),
    linear-gradient(135deg,#071018,#202027 55%,#15131e);
  padding:25px 18px 50px;
}

.container{
  max-width:650px;
  margin:auto;
}

.header{
  display:flex;
  align-items:center;
  gap:18px;
  margin:25px 10px 30px;
}

.logo{
  width:85px;
  height:85px;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  background:linear-gradient(145deg,#333,#111);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.15),
    0 15px 35px rgba(0,0,0,.25);
}

.small-title{
  color:#aaa;
  letter-spacing:4px;
  font-size:13px;
  margin-bottom:5px;
}

h1{
  font-size:40px;
  letter-spacing:-2px;
}

.card{
  border:1px solid rgba(255,255,255,.18);
  border-radius:40px;
  padding:30px;
  background:rgba(25,25,32,.55);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.12),
    0 20px 50px rgba(0,0,0,.25);
}

.download-title{
  display:flex;
  align-items:center;
  gap:20px;
  margin-bottom:30px;
}

.download-icon{
  width:76px;
  height:76px;
  border-radius:25px;
  border:1px solid rgba(255,255,255,.2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  color:#168cff;
  background:rgba(10,20,25,.5);
}

.download-title h2{
  font-size:32px;
}

.download-title p{
  color:#aaa;
  font-size:20px;
  margin-top:4px;
}

.input-box{
  display:flex;
  align-items:center;
  gap:12px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:30px;
  padding:18px 20px;
  background:rgba(5,8,12,.55);
  margin-bottom:22px;
}

.input-box span{
  font-size:25px;
}

input{
  width:100%;
  background:none;
  border:none;
  outline:none;
  color:white;
  font-size:18px;
}

input::placeholder{
  color:#777;
}

button{
  width:100%;
  border:none;
  border-radius:28px;
  padding:20px;
  color:white;
  font-size:24px;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(135deg,#168cff,#087cf0);
  box-shadow:0 10px 30px rgba(0,130,255,.25);
  transition:.2s;
}

button:active{
  transform:scale(.97);
}

button:disabled{
  opacity:.6;
}

.status{
  text-align:center;
  margin-top:18px;
  font-size:16px;
  min-height:25px;
}

.result{
  display:none;
  margin-top:25px;
  padding:20px;
  border-radius:25px;
  background:rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.12);
}

.result video{
  width:100%;
  max-height:500px;
  border-radius:20px;
  margin-bottom:15px;
}

.download-result{
  display:block;
  text-decoration:none;
  text-align:center;
  padding:16px;
  border-radius:20px;
  background:#168cff;
  color:white;
  font-weight:bold;
}

.features{
  margin-top:25px;
  display:grid;
  gap:16px;
}

.feature{
  border:1px solid rgba(255,255,255,.14);
  border-radius:25px;
  padding:28px;
  text-align:center;
  background:rgba(20,20,25,.5);
  backdrop-filter:blur(20px);
}

.feature .check{
  color:#00c92b;
  font-size:28px;
  margin-bottom:8px;
}

.feature p{
  color:#bbb;
  font-size:17px;
  font-weight:600;
}

footer{
  text-align:center;
  margin-top:40px;
  color:#888;
  font-size:15px;
}

@media(max-width:500px){
  h1{
    font-size:34px;
  }

  .card{
    padding:25px 18px;
    border-radius:32px;
  }

  .download-title h2{
    font-size:27px;
  }

  .download-title p{
    font-size:17px;
  }

  .download-icon{
    width:65px;
    height:65px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">♪</div>

    <div>
      <div class="small-title">LIQUID GLASS</div>
      <h1>TikTok Downloader</h1>
    </div>
  </div>


  <div class="card">

    <div class="download-title">

      <div class="download-icon">↓</div>

      <div>
        <h2>Download Video</h2>
        <p>Tempel link TikTok kamu di bawah.</p>
      </div>

    </div>


    <div class="input-box">
      <span>🔗</span>

      <input
        id="url"
        type="url"
        placeholder="Tempel link TikTok..."
        autocomplete="off"
      >
    </div>


    <button id="downloadBtn" onclick="downloadTikTok()">
      ↓ Download
    </button>


    <div id="status" class="status"></div>


    <div id="result" class="result">

      <video
        id="video"
        controls
        playsinline>
      </video>

      <a
        id="downloadLink"
        class="download-result"
        target="_blank"
        rel="noopener">
        ↓ Simpan Video
      </a>

    </div>

  </div>


  <div class="features">

    <div class="feature">
      <div class="check">✓</div>
      <p>Liquid Glass UI</p>
    </div>

    <div class="feature">
      <div class="check">✓</div>
      <p>Mobile Friendly</p>
    </div>

    <div class="feature">
      <div class="check">✓</div>
      <p>Simple & Clean</p>
    </div>

  </div>


  <footer>
    TikTok Downloader · Gunakan secara bertanggung jawab
  </footer>

</div>


<script>

async function downloadTikTok(){

  const input = document.getElementById("url");
  const button = document.getElementById("downloadBtn");
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const video = document.getElementById("video");
  const downloadLink = document.getElementById("downloadLink");

  const url = input.value.trim();

  if(!url){
    status.textContent = "Masukkan link TikTok terlebih dahulu.";
    status.style.color = "#ff5555";
    return;
  }

  if(
    !url.includes("tiktok.com") &&
    !url.includes("vt.tiktok.com")
  ){
    status.textContent = "Link tersebut bukan link TikTok.";
    status.style.color = "#ff5555";
    return;
  }

  button.disabled = true;
  button.textContent = "⏳ Memproses...";
  status.textContent = "Menghubungkan ke server...";
  status.style.color = "#aaa";

  result.style.display = "none";

  try{

    const response = await fetch(
      "https://www.tikwm.com/api/",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/x-www-form-urlencoded"
        },

        body:
          "url=" +
          encodeURIComponent(url) +
          "&hd=1"
      }
    );

    if(!response.ok){
      throw new Error("Server API error");
    }

    const data = await response.json();

    if(
      data &&
      data.data &&
      (data.data.play || data.data.hdplay)
    ){

      const videoURL =
        data.data.hdplay ||
        data.data.play;

      video.src = videoURL;

      downloadLink.href = videoURL;

      downloadLink.download = "tiktok-video.mp4";

      result.style.display = "block";

      status.textContent = "✓ Video berhasil ditemukan!";
      status.style.color = "#00d639";

    }else{

      throw new Error(
        data.msg ||
        "Video tidak ditemukan."
      );

    }

  }catch(error){

    console.error(error);

    status.textContent =
      "Gagal memproses video. Coba lagi beberapa saat.";

    status.style.color = "#ff4b4b";

  }finally{

    button.disabled = false;
    button.textContent = "↓ Download";

  }

}

</script>

</body>
</html>
