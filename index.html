<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eef2f8">

<title>TikTok Downloader</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --blue: #007aff;
    --text: #111114;
    --secondary: #6e6e73;
}

body {
    min-height: 100vh;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 5%,
            rgba(100,180,255,.45),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 35%,
            rgba(190,150,255,.38),
            transparent 35%
        ),
        radial-gradient(
            circle at 30% 100%,
            rgba(100,230,255,.3),
            transparent 35%
        ),
        #f3f5f9;

    overflow-x: hidden;
}

/* Background */

.background-blur {
    position: fixed;
    inset: 0;
    pointer-events: none;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

/* Main */

.page {
    position: relative;
    z-index: 2;

    width: min(92%, 680px);

    margin: auto;

    padding:
        45px 0
        30px;
}

/* Header */

.header {
    display: flex;
    align-items: center;

    gap: 15px;

    margin-bottom: 25px;
}

.app-icon {
    width: 60px;
    height: 60px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 19px;

    background:
        linear-gradient(
            145deg,
            #151515,
            #444
        );

    color: white;

    font-size: 34px;
    font-weight: bold;

    border:
        1px solid
        rgba(255,255,255,.8);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.18);

    backdrop-filter: blur(20px);
}

.eyebrow {
    font-size: 10px;
    letter-spacing: 2px;

    color: #777;

    font-weight: 700;

    margin-bottom: 4px;
}

h1 {
    font-size: clamp(26px, 7vw, 36px);

    letter-spacing: -1.5px;
}

/* Glass card */

.glass-card {
    position: relative;

    padding: 27px;

    border-radius: 30px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.76),
            rgba(255,255,255,.40)
        );

    border:
        1px solid
        rgba(255,255,255,.9);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.12);

    backdrop-filter:
        blur(35px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(35px)
        saturate(160%);

    overflow: hidden;
}

.glass-card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 8%;

    width: 84%;
    height: 1px;

    background: white;
}

/* Card title */

.card-title {
    display: flex;

    align-items: center;

    gap: 14px;

    margin-bottom: 22px;
}

.download-icon {
    width: 48px;
    height: 48px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 16px;

    background:
        rgba(255,255,255,.65);

    border:
        1px solid
        rgba(255,255,255,.9);

    color: var(--blue);

    font-size: 25px;

    box-shadow:
        0 6px 20px
        rgba(0,0,0,.06);
}

.card-title h2 {
    font-size: 20px;

    margin-bottom: 4px;
}

.card-title p {
    color: var(--secondary);

    font-size: 13px;
}

/* Input */

.input-box {
    display: flex;

    align-items: center;

    gap: 9px;

    min-height: 58px;

    padding:
        5px
        8px
        5px
        16px;

    border-radius: 18px;

    background:
        rgba(255,255,255,.65);

    border:
        1px solid
        rgba(255,255,255,.95);

    box-shadow:
        inset 0 1px 2px
        rgba(0,0,0,.04);

    transition: .2s;
}

.input-box:focus-within {
    border-color:
        rgba(0,122,255,.5);

    box-shadow:
        0 0 0 4px
        rgba(0,122,255,.10);
}

.link-icon {
    font-size: 17px;

    opacity: .65;
}

#urlInput {
    flex: 1;

    min-width: 0;

    border: none;
    outline: none;

    background: transparent;

    font-size: 15px;

    color: var(--text);
}

#urlInput::placeholder {
    color: #8b8b91;
}

/* Clear button */

.clear {
    width: 30px;
    height: 30px;

    border: none;

    border-radius: 50%;

    display: none;

    justify-content: center;
    align-items: center;

    background:
        rgba(120,120,128,.16);

    color: #666;

    font-size: 20px;

    cursor: pointer;
}

/* Download button */

.download-btn {
    width: 100%;

    min-height: 57px;

    margin-top: 14px;

    border: none;

    border-radius: 18px;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 8px;

    color: white;

    background:
        linear-gradient(
            180deg,
            #1688ff,
            #007aff
        );

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 10px 27px
        rgba(0,122,255,.28);

    transition:
        transform .15s,
        box-shadow .15s;
}

.download-btn:hover {
    box-shadow:
        0 15px 32px
        rgba(0,122,255,.35);
}

.download-btn:active {
    transform: scale(.98);
}

.download-btn:disabled {
    opacity: .55;
    cursor: not-allowed;
}

/* Loading */

.loading {
    margin-top: 18px;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 12px;

    padding: 15px;

    border-radius: 17px;

    background:
        rgba(255,255,255,.45);
}

.spinner {
    width: 22px;
    height: 22px;

    border-radius: 50%;

    border:
        3px solid
        rgba(0,122,255,.15);

    border-top-color:
        var(--blue);

    animation:
        spin .7s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.loading strong {
    font-size: 14px;
}

.loading p {
    margin-top: 2px;

    color: var(--secondary);

    font-size: 12px;
}

/* Result */

.result {
    margin-top: 18px;

    padding: 14px;

    display: flex;

    align-items: center;

    gap: 12px;

    border-radius: 18px;

    background:
        rgba(255,255,255,.55);

    border:
        1px solid
        rgba(255,255,255,.8);
}

.success {
    width: 40px;
    height: 40px;

    display: flex;
    justify-content: center;
    align-items: center;

    flex-shrink: 0;

    border-radius: 50%;

    background: #34c759;

    color: white;

    font-weight: bold;
}

.result-info {
    flex: 1;
}

.result-info strong {
    font-size: 14px;
}

.result-info p {
    margin-top: 3px;

    color: var(--secondary);

    font-size: 12px;
}

.save-btn {
    padding:
        11px
        17px;

    border-radius: 13px;

    color: var(--blue);

    background:
        rgba(0,122,255,.12);

    text-decoration: none;

    font-size: 13px;

    font-weight: 700;
}

/* Error */

#error {
    color: #ff3b30;

    text-align: center;

    font-size: 13px;

    margin-top: 13px;
}

/* Info */

.info {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 10px;

    margin-top: 15px;
}

.info-item {
    padding: 14px 10px;

    text-align: center;

    border-radius: 17px;

    background:
        rgba(255,255,255,.4);

    border:
        1px solid
        rgba(255,255,255,.65);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    color: #555;

    font-size: 11px;
}

.info-item span {
    display: block;

    margin-bottom: 5px;

    color: #34c759;

    font-size: 17px;
}

/* Footer */

footer {
    margin-top: 25px;

    text-align: center;

    color: #85858a;

    font-size: 11px;
}

/* Hidden */

.hidden {
    display: none !important;
}

/* Mobile */

@media(max-width:600px) {

    .page {
        padding-top: 30px;
    }

    .glass-card {
        padding: 20px;

        border-radius: 25px;
    }

    .app-icon {
        width: 54px;
        height: 54px;

        border-radius: 17px;

        font-size: 30px;
    }

    .info {
        grid-template-columns: 1fr;
    }

    .info-item {
        padding: 12px;
    }

    .result {
        flex-wrap: wrap;
    }

    .save-btn {
        width: 100%;

        text-align: center;
    }
}
</style>
</head>

<body>

<div class="background-blur"></div>

<main class="page">

    <!-- HEADER -->
    <header class="header">

        <div class="app-icon">
            ♪
        </div>

        <div>
            <div class="eyebrow">
                LIQUID GLASS
            </div>

            <h1>
                TikTok Downloader
            </h1>
        </div>

    </header>


    <!-- MAIN -->
    <section class="glass-card">

        <div class="card-title">

            <div class="download-icon">
                ↓
            </div>

            <div>

                <h2>
                    Download Video
                </h2>

                <p>
                    Tempel link TikTok kamu di bawah.
                </p>

            </div>

        </div>


        <!-- INPUT -->
        <div class="input-box">

            <span class="link-icon">
                🔗
            </span>

            <input
                id="urlInput"
                type="url"
                placeholder="Tempel link TikTok..."
                autocomplete="off"
            >

            <button
                id="clearBtn"
                class="clear"
                type="button"
            >
                ×
            </button>

        </div>


        <!-- BUTTON -->
        <button
            id="downloadBtn"
            class="download-btn"
            type="button"
        >

            <span>
                ↓
            </span>

            <span>
                Download
            </span>

        </button>


        <!-- LOADING -->
        <div
            id="loading"
            class="loading hidden"
        >

            <div class="spinner"></div>

            <div>

                <strong>
                    Memproses...
                </strong>

                <p>
                    Mohon tunggu sebentar
                </p>

            </div>

        </div>


        <!-- RESULT -->
        <div
            id="result"
            class="result hidden"
        >

            <div class="success">
                ✓
            </div>

            <div class="result-info">

                <strong>
                    Video siap
                </strong>

                <p>
                    Video berhasil diproses.
                </p>

            </div>

            <a
                id="downloadLink"
                class="save-btn"
                href="#"
            >
                Simpan
            </a>

        </div>


        <!-- ERROR -->
        <p id="error"></p>

    </section>


    <!-- FEATURES -->
    <section class="info">

        <div class="info-item">

            <span>✓</span>

            Liquid Glass UI

        </div>

        <div class="info-item">

            <span>✓</span>

            Mobile Friendly

        </div>

        <div class="info-item">

            <span>✓</span>

            Simple & Clean

        </div>

    </section>


    <footer>
        TikTok Downloader • Gunakan secara bertanggung jawab
    </footer>

</main>


<script>

const urlInput =
    document.getElementById(
        "urlInput"
    );

const clearBtn =
    document.getElementById(
        "clearBtn"
    );

const downloadBtn =
    document.getElementById(
        "downloadBtn"
    );

const loading =
    document.getElementById(
        "loading"
    );

const result =
    document.getElementById(
        "result"
    );

const downloadLink =
    document.getElementById(
        "downloadLink"
    );

const errorText =
    document.getElementById(
        "error"
    );


/* INPUT */

urlInput.addEventListener(
    "input",
    function() {

        errorText.textContent = "";

        if (
            urlInput.value.trim()
        ) {

            clearBtn.style.display =
                "flex";

        } else {

            clearBtn.style.display =
                "none";

        }

    }
);


/* CLEAR */

clearBtn.addEventListener(
    "click",
    function() {

        urlInput.value = "";

        clearBtn.style.display =
            "none";

        result.classList.add(
            "hidden"
        );

        errorText.textContent = "";

        urlInput.focus();

    }
);


/* ENTER */

urlInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            downloadVideo();

        }

    }
);


/* DOWNLOAD */

downloadBtn.addEventListener(
    "click",
    downloadVideo
);


async function downloadVideo() {

    const url =
        urlInput.value.trim();


    errorText.textContent = "";

    result.classList.add(
        "hidden"
    );


    /* Check */

    if (!url) {

        errorText.textContent =
            "Masukkan link TikTok terlebih dahulu.";

        return;

    }


    if (
        !url.includes(
            "tiktok.com"
        )
    ) {

        errorText.textContent =
            "Link yang dimasukkan bukan link TikTok.";

        return;

    }


    /*
     * GitHub Pages tidak dapat
     * menjalankan server.js.
     *
     * Bagian ini adalah tempat
     * API downloader kamu.
     */

    downloadBtn.disabled = true;

    loading.classList.remove(
        "hidden"
    );


    try {

        /*
         * DEMO:
         * Simulasi proses.
         *
         * Untuk downloader sungguhan,
         * ganti bagian ini dengan
         * endpoint backend milikmu.
         */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    1500
                )
        );


        /*
         * Karena belum ada backend,
         * tampilkan pesan.
         */

        throw new Error(
            "Backend downloader belum terhubung. GitHub Pages hanya menjalankan frontend."
        );


    } catch(error) {

        errorText.textContent =
            error.message;

    } finally {

        downloadBtn.disabled = false;

        loading.classList.add(
            "hidden"
        );

    }

}

</script>

</body>
</html>
